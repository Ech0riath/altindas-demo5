name: Hostinger package
# main dalındaki her değişiklikte Hostinger paketini hazırlar ve
# - depo sırlarında FTP bilgileri varsa dosyaları FTP ile doğrudan siteye yükler,
# - aynı paketi "hostinger" dalına da yazar (hPanel → Git ile çekmek isteyene).
# FTP yüklemesi yalnız paketteki dosyaları yazar; sunucudaki app/config.php ve
# uploads/ içindeki panel fotoğraflarına dokunmaz.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hostinger
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_DIR: ${{ secrets.FTP_DIR }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check PHP syntax
        run: for f in app/*.php web/index.php scripts/export.php; do php -l "$f"; done
      - name: Verify templates
        run: npm run build && npm run check
      - name: Build package
        run: sh scripts/package-hostinger.sh build/hostinger
      - name: Detect FTP settings
        id: ftp
        if: env.FTP_SERVER != ''
        run: |
          set -eu
          server="${FTP_SERVER#*://}"; server="${server%%/*}"
          list() { curl -sS --max-time 30 --list-only -u "$FTP_USERNAME:$FTP_PASSWORD" "$@" "ftp://$server/"; }
          # Önce şifreli bağlantı (FTPS); sunucu desteklemezse düz FTP.
          if listing=$(list --ssl-reqd --insecure); then protocol=ftps; else listing=$(list); protocol=ftp; fi
          has() { printf '%s\n' "$listing" | tr -d '\r' | grep -qx "$1"; }
          if [ -n "${FTP_DIR:-}" ]; then dir="$FTP_DIR"
          elif has public_html; then dir=public_html/demo/
          elif has index.php && has app; then dir=./
          else dir=demo/
          fi
          echo "server=$server" >> "$GITHUB_OUTPUT"
          echo "protocol=$protocol" >> "$GITHUB_OUTPUT"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "FTP bağlantısı: $protocol, hedef klasör: $dir"
      - name: Upload to Hostinger over FTP
        if: env.FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ steps.ftp.outputs.server }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ steps.ftp.outputs.protocol }}
          security: loose
          local-dir: build/hostinger/
          server-dir: ${{ steps.ftp.outputs.dir }}
      - name: Publish to hostinger branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898237+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin hostinger >/dev/null; then
            git fetch --depth=1 origin hostinger
            git worktree add build/deploy FETCH_HEAD
          else
            git worktree add --detach build/deploy
            git -C build/deploy checkout --orphan hostinger-new
            git -C build/deploy rm -rfq .
          fi
          rsync -a --delete --exclude .git build/hostinger/ build/deploy/
          cd build/deploy
          git add -A
          if git diff --cached --quiet; then
            echo "Paket değişmedi."
            exit 0
          fi
          git commit -q -m "Hostinger paketi: ${GITHUB_SHA::7}"
          git push origin HEAD:refs/heads/hostinger
